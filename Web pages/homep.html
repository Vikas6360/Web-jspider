<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../CSS/signup.css">
</head>
<body>
    <form action="">
        <h1>SignUp form</h1>
        <div>
            <label for="user">Username</label>
            <input type="text" name="" id="user" placeholder="Enter username" >
            <span id="uerror" class="error"></span>
        </div>
        <div>
            <label for="pass">Password</label>
            <input type="text" name="" id="pass" placeholder="Enter Password" >
            <span id="perror" class="error"></span>
        </div>
        <div>
            <label for="cpass">Confirm Password</label>
            <input type="text" name="" id="cpass" placeholder="Confirm Password" >
            <span id="cperror" class="error"></span>
        </div>
        <div>
            <label for="mail">Enter E-Mail Id</label>
            <input type="email" name="" id="mail" placeholder="Jhon@gmail.com" >
            <span id="merror" class="error"></span>
        </div>
        <div>
            <label for="num">Number</label>
            <input type="text" name="" id="num" placeholder="+91 " >
            <span id="nerror" class="error"></span>
        </div>
        <div>
            <label for="date">DOB</label>
            <input type="date" name="" id="date" >
            <span id="derror" class="error"></span>
        </div>
        <div>
            <label for="gender">Gender</label>
            <input type="radio" id="gender" name="gender">Male
            <input type="radio" id="gender" name="gender">Female
            <input type="radio" id="gender" name="gender">Others
            <span id="gerror" class="error"></span>
        </div>
        <div>
            <button>SignUp</button>
            <button>Cancel</button>
        </div>
        <div>
            <a href="./HTML/login.html">Already have an account</a>
        </div>
    </form>
    <script src="../JS/signup.js"></script>
</body>
</html>
