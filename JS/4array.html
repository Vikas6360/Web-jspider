<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>


        let n=prompt("enter a num");

        let arr=[];

        for(let i=1;i<=n;i++){
            arr[i-1]=i;
        }

        console.log(arr);

        let arr1=arr.reduce((res,curr)=>{
            return res+curr;
        })

        console.log(arr1);

        let arr2=arr.reduce((res,curr)=>{
            return res*curr;
        })

        console.log(arr2);

    </script>
</body>
</html>
