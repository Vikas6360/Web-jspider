<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        header{
            background-color: aqua;
            height: 100px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        nav{
            height: 50px;
            width: 100%;
            background-color: rgb(0, 0, 0);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        nav>div:nth-child(1)>input{
            padding: 7px 90px;
            background-color: rgb(255, 255, 255);
            border-radius: 20px;
        }
        nav>div:nth-child(2)>img{
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }
*{
    margin: 0;
}
        
    </style>
</head>

<body>
    <header>
        <nav>
            <div>
                <input type="text" placeholder="pay anyone using UPI">

            </div>

                    alt="">

</html>
