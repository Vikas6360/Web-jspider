<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            text-align: center;
        }
        a:link{
            color: aqua;
        }
        a:visited{
            color: red;
        }
        a:hover{
            color: goldenrod;
        }
        a:active{
            color: palevioletred;
        }
        div{
            height: 400px;
            width: 400px;
            background-color: blue;
            border-radius: 5px;
            transition-timing-function: ease-in-out;
            transition-delay: 0s;
            transition-duration: 2s;

        }

        div:hover{
            background-color: yellow;
            cursor: pointer;
        }
    </style>

</head>
<body>
    <h1>Dynamic pseudo class</h1>
    <hr>

    <a href="">link</a>
    <a href="https://www.google.com">insta</a>

    <div></div>

</body>
</html>
