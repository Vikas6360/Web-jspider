<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body>div:nth-child(1){
            height: 500px;
            width: 600px;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTl37Ha8cXj2c-sdAN1bfoPl31dXDgypc55Kw&s");
            background-repeat: no-repeat;
            background-size: 600px 500px;
            transition: all 5s linear 5s;
        }

        body>div:nth-child(1):hover{
            cursor: pointer;
            background-image: url("https://www.shutterstock.com/image-photo/sun-sets-behind-mountain-ranges-600nw-2479236003.jpg");
            transform: scale(4);
            transform: rotate(360deg);
            border-radius: 50%;
        }

        body{
            background-color: black;
        }
    </style>
</head>
<body>
    <div>
        <div>

        </div>
    </div>
</body>
</html>
