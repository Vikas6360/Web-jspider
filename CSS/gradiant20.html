<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
        }
        body>div:nth-child(4){
            height: 300px;
            background-image: linear-gradient(to top left, aqua,black);
        }
        body>div:nth-child(6){
            height: 300px;
            background-image: repeating-linear-gradient(to top right, black 0%,black 5%, white 5%, white 20%);
        }
        body>div:nth-child(8){
            height: 300px;
            background-image: radial-gradient(yellow,black);
        }
        body>div:nth-child(10){
            height: 300px;
            background-image: repeating-radial-gradient(yellow 0%,yellow 5%, black 0%, black 5% );
        }
        body>div:nth-child(12){
            height: 300px;
            background-image: conic-gradient(aqua,black, red, blue, yellow);
        }
        body>div:nth-child(14){
            height: 300px;
            background-image: repeating-conic-gradient(aqua 0%,aqua 1%, black 1%, black 2%);
        }

        
    </style>
</head>
<body>
    <h1>gradients in css</h1>
    <hr>
    <h2>linear gradiennt</h2>
    <div>
    </div>

    <hr>

    <hr>

    <hr>

</body>
</html>
